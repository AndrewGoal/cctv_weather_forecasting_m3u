<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="天气预报表背景">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0b2238"/>
      <stop offset="0.52" stop-color="#081426"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3aa7ef" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#1d6ea8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a2036" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb44d" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#ffb44d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fc3e8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#ffb44d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="330" cy="250" rx="540" ry="390" fill="url(#glow)"/>
  <ellipse cx="1070" cy="170" rx="400" ry="320" fill="url(#warmGlow)"/>

  <g opacity="0.55" fill="#8fb9dc">
    <circle cx="160" cy="130" r="2.2"/>
    <circle cx="228" cy="86" r="1.5"/>
    <circle cx="420" cy="146" r="1.8"/>
    <circle cx="525" cy="76" r="1.3"/>
    <circle cx="900" cy="98" r="1.7"/>
    <circle cx="1010" cy="296" r="1.4"/>
    <circle cx="1150" cy="120" r="2"/>
    <circle cx="760" cy="58" r="1.2"/>
    <circle cx="640" cy="180" r="1.6"/>
    <circle cx="290" cy="210" r="1.2"/>
    <circle cx="1180" cy="300" r="1.5"/>
    <circle cx="80" cy="330" r="1.4"/>
  </g>

  <circle cx="1000" cy="180" r="58" fill="#ffcf83" opacity="0.9"/>
  <circle cx="1000" cy="180" r="58" fill="none" stroke="#ffe3b3" stroke-opacity="0.38" stroke-width="1.5"/>
  <circle cx="1000" cy="180" r="88" fill="none" stroke="#ffcf83" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="1000" cy="180" r="120" fill="none" stroke="#ffcf83" stroke-opacity="0.05" stroke-width="1.5"/>

  <g filter="url(#soft)" opacity="0.7">
    <ellipse cx="310" cy="430" rx="300" ry="130" fill="#5ca8d8" opacity="0.36"/>
    <ellipse cx="900" cy="500" rx="300" ry="130" fill="#3d7fb0" opacity="0.22"/>
  </g>

  <g>
    <g fill="url(#cloud)" opacity="0.9">
      <circle cx="232" cy="452" r="58"/>
      <circle cx="296" cy="428" r="78"/>
      <circle cx="368" cy="456" r="58"/>
      <rect x="230" y="452" width="142" height="62" rx="31"/>
    </g>
    <g fill="#e6f6ff" opacity="0.26">
      <circle cx="968" cy="540" r="34"/>
      <circle cx="1010" cy="524" r="48"/>
      <circle cx="1054" cy="542" r="34"/>
      <rect x="966" y="540" width="92" height="38" rx="19"/>
    </g>
    <g fill="url(#cloud)" opacity="0.18">
      <circle cx="650" cy="640" r="30"/>
      <circle cx="692" cy="622" r="42"/>
      <circle cx="734" cy="640" r="30"/>
      <rect x="648" y="640" width="88" height="32" rx="16"/>
    </g>
  </g>

  <rect x="0" y="716" width="1280" height="4" fill="url(#accent)" opacity="0.3"/>
</svg>
